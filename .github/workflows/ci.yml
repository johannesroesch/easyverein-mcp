name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: ${{ matrix.php == '8.2' && 'xdebug' || 'none' }}

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run unit tests
        run: composer test-unit

      - name: Run integration tests
        run: composer test-integration

      - name: Generate coverage report
        if: matrix.php == '8.2'
        run: php vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text

      - name: Coverage summary and threshold check
        if: matrix.php == '8.2'
        run: |
          php << 'PHPEOF'
          <?php
          $x       = simplexml_load_file('coverage.xml');
          $m       = $x->project->metrics;
          $stmts   = (int) $m['statements'];
          $covered = (int) $m['coveredstatements'];
          $pct     = $stmts > 0 ? round($covered / $stmts * 100, 1) : 0.0;
          $icon    = $pct >= 80 ? '🟢' : ($pct >= 70 ? '🟡' : '🔴');

          $classes = (int) $m['classes'];
          $covCls  = (int) $m['coveredclasses'];
          $methods = (int) $m['methods'];
          $covMth  = (int) $m['coveredmethods'];
          $pctMth  = $methods > 0 ? round($covMth / $methods * 100, 1) : 0.0;
          $pctCls  = $classes > 0 ? round($covCls / $classes * 100, 1) : 0.0;

          $summary = "## {$icon} Coverage: {$pct}%\n\n"
              . "| Metric | Covered | Total | % |\n"
              . "|--------|---------|-------|---|\n"
              . "| Lines   | {$covered} | {$stmts} | {$pct}% |\n"
              . "| Methods | {$covMth}  | {$methods} | {$pctMth}% |\n"
              . "| Classes | {$covCls}  | {$classes} | {$pctCls}% |\n";

          file_put_contents(getenv('GITHUB_STEP_SUMMARY'), $summary);

          if ($pct < 70) {
              fwrite(STDERR, "Coverage {$pct}% is below the 70% threshold\n");
              exit(1);
          }
          PHPEOF

  # ── Dependency audit ───────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Check for known vulnerabilities
        run: composer audit

  # ── Static analysis ────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyse

  # ── Code style ─────────────────────────────────────────────────────────────
  code-style:
    name: Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Check code style
        run: composer cs-check
